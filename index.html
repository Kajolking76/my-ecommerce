<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>শখের কুঞ্জ | শখের জুয়েলারি</style>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, "Noto Sans Bengali", sans-serif;
            background: #080808;
            color: #ffffff;
            overflow-x: hidden;
        }


        /* =========================
           LOADER
        ========================= */

        .loader {
            position: fixed;
            inset: 0;
            background: #050505;
            z-index: 9999;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            animation: hideLoader 1s ease 2.5s forwards;
        }

        .loader img {
            width: 140px;
            height: 140px;
            object-fit: contain;

            animation: logoReveal 1.3s ease;
        }

        .loader h2 {
            color: #e6bd70;
            margin-top: 15px;
            font-size: 24px;
        }

        .loader p {
            color: #b89a61;
            margin-top: 8px;
            font-size: 13px;
        }

        @keyframes logoReveal {
            from {
                opacity: 0;
                transform: scale(.6);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes hideLoader {
            to {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }


        /* =========================
           HEADER
        ========================= */

        header {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 70px;

            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            background: rgba(5, 5, 5, .92);
            backdrop-filter: blur(15px);

            border-bottom:
                1px solid rgba(225, 181, 95, .15);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            text-decoration: none;
        }

        .brand img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .brand span {
            color: #e6bd70;
            font-size: 18px;
            font-weight: bold;
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon {
            position: relative;
            font-size: 24px;
            cursor: pointer;
        }

        .cart-count {
            position: absolute;

            top: -8px;
            right: -10px;

            width: 19px;
            height: 19px;

            border-radius: 50%;

            background: #c99742;
            color: #080808;

            font-size: 10px;
            font-weight: bold;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 100vh;

            padding: 120px 20px 80px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            position: relative;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(195, 145, 58, .18),
                    transparent 42%
                ),
                #080808;
        }

        .hero::before {
            content: "";

            position: absolute;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            border:
                1px solid rgba(225, 181, 95, .16);

            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-logo {
            width: 210px;
            max-width: 75vw;

            margin-bottom: 20px;

            animation: floating 4s ease-in-out infinite;
        }

        @keyframes floating {
            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .hero h1 {
            color: #e6bd70;
            font-size: 36px;
            margin-bottom: 12px;
        }

        .hero p {
            max-width: 430px;
            margin: auto;

            color: #d0c6b5;

            line-height: 1.8;
            font-size: 15px;
        }

        .shop-btn {
            display: inline-block;

            margin-top: 28px;

            padding: 14px 32px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #f4d58e,
                    #c99742
                );

            color: #080808;

            text-decoration: none;
            font-weight: bold;

            transition: .3s;
        }

        .shop-btn:hover {
            transform: translateY(-3px);
        }


        /* =========================
           SECTIONS
        ========================= */

        section {
            padding: 65px 18px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 32px;
        }

        .section-title h2 {
            color: #e6bd70;
            font-size: 27px;
        }

        .section-title p {
            color: #8f887d;
            font-size: 13px;
            margin-top: 10px;
        }


        /* =========================
           CATEGORIES
        ========================= */

        .categories-section {
            background:
                radial-gradient(
                    circle at top,
                    rgba(195, 145, 58, .10),
                    transparent 50%
                );
        }

        .category-grid {
            max-width: 1300px;
            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;
        }

        .category-card {
            position: relative;

            height: 370px;

            overflow: hidden;

            border-radius: 20px;

            background: #111;

            border:
                1px solid rgba(225, 181, 95, .55);

            cursor: pointer;

            transition: .35s;
        }

        .category-card:hover {
            transform: translateY(-7px);

            box-shadow:
                0 20px 45px rgba(0,0,0,.6);
        }

        .category-card img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition: .5s;
        }

        .category-card:hover img {
            transform: scale(1.06);
        }

        .category-overlay {
            position: absolute;

            bottom: 0;
            left: 0;

            width: 100%;

            padding: 55px 18px 20px;

            background:
                linear-gradient(
                    transparent,
                    rgba(0,0,0,.97)
                );
        }

        .category-overlay h3 {
            color: #e6bd70;
            font-size: 21px;
            margin-bottom: 8px;
        }

        .category-overlay span {
            color: #ddd;
            font-size: 12px;
        }


        /* =========================
           PRODUCTS
        ========================= */

        .product-grid {
            max-width: 1300px;
            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;
        }

        .product {
            background: #111;

            border-radius: 18px;

            overflow: hidden;

            border:
                1px solid rgba(225, 181, 95, .16);

            transition: .3s;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        .product-image {
            height: 250px;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;

            top: 12px;
            left: 12px;

            background: #c99742;
            color: #080808;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 10px;
            font-weight: bold;
        }

        .wishlist-btn {
            position: absolute;

            top: 10px;
            right: 10px;

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;

            background: rgba(0,0,0,.65);

            color: white;

            font-size: 20px;

            cursor: pointer;
        }

        .wishlist-btn.active {
            color: #e6bd70;
        }

        .product-info {
            padding: 16px;
        }

        .product-info h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .product-info p {
            color: #8f887d;
            font-size: 12px;
            margin-bottom: 13px;
        }

        .price {
            color: #e6bd70;
            font-size: 19px;
            font-weight: bold;
        }

        .old-price {
            color: #777;
            font-size: 13px;

            text-decoration: line-through;

            margin-left: 8px;
        }

        .cart-btn {
            width: 100%;

            margin-top: 15px;

            padding: 12px;

            border-radius: 9px;

            border: 1px solid #9d783b;

            background: transparent;
